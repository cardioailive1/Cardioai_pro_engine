# CardioAI Pro — Render deployment blueprint
#
# One service today (backend serves the frontend as static files, so the
# app is fully connected out of the box). The two commented-out services
# show how to split into hospital-grade production topology later:
# a dedicated worker for stream ingestion/inference so a slow model call
# never blocks the API, and a managed Postgres for the event log / FHIR
# resource store (currently in-memory).

services:
  - type: web
    name: cardioai-pro-engine
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard          # bump to `pro` for production hospital traffic
    region: ohio             # co-locate with your primary hospital systems
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.9
      # Cloudflare R2 (S3-compatible) — persistent storage for the Data
      # Room's Document Room. Leave unset and the app falls back to
      # ephemeral local disk (works, but does not survive a redeploy or
      # a free-tier spin-down) — no code change needed either way.
      # `sync: false` means Render prompts for these in the dashboard
      # rather than reading them from this file, so real credentials
      # never end up committed to the repo.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

