# CardioAI Pro — Render deployment blueprint
#
# Two services: the web app, and a managed Postgres database backing
# real user/organization/role data for RBAC — this cannot be in-memory
# or on local disk the way earlier demo data was; losing every user
# account on a redeploy would be a far worse failure than losing demo
# documents. The worker line below is still commented out — stream
# ingestion doesn't need its own process yet.

services:
  - type: web
    name: cardioai-pro-engine
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard          # bump to `pro` for production hospital traffic
    region: ohio             # co-locate with your primary hospital systems
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.9
      # Real Postgres connection string, auto-injected by Render from
      # the `databases:` block below — nothing to configure by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: cardioai-pro-db
          property: connectionString
      # Signs session tokens (JWTs) for the RBAC login system below.
      # `generateValue: true` has Render generate and store a real
      # random secret on first deploy — never committed to the repo,
      # never typed in by hand. If this ever needs rotating, every
      # issued session token is invalidated at once (by design).
      - key: JWT_SECRET_KEY
        generateValue: true
      # Application-level encryption at rest (encryption.py) for Data Room
      # documents — independent of whatever the storage backend (local
      # disk, Cloudflare R2) does on its own. Same pattern as
      # JWT_SECRET_KEY: Render generates and stores a real random key on
      # first deploy, never committed to the repo. Rotate by setting a new
      # value AND moving the old one into APP_ENCRYPTION_KEY_PREVIOUS
      # (comma-separated if rotating more than once) so previously
      # encrypted documents stay readable — see encryption.py.
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: APP_ENCRYPTION_KEY_PREVIOUS
        sync: false
      # Cloudflare R2 (S3-compatible) — persistent storage for the Data
      # Room's Document Room. Leave unset and the app falls back to
      # ephemeral local disk (works, but does not survive a redeploy or
      # a free-tier spin-down) — no code change needed either way.
      # `sync: false` means Render prompts for these in the dashboard
      # rather than reading them from this file, so real credentials
      # never end up committed to the repo.
      #
      # R2_ENDPOINT_URL is what Cloudflare's current R2 API token screen
      # actually hands you as "S3 API endpoint" (the full
      # https://<account-id>.r2.cloudflarestorage.com URL) — set that
      # directly. R2_ACCOUNT_ID (just the bare ID, used to build the
      # same URL) is accepted as an alternative if that's what you have
      # instead; either one alone is enough, not both.
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # Data Room access code — a single shared password, deliberately
      # separate from the RBAC system above. Due-diligence investors
      # come from many different firms, not this company's own
      # organization account system, so they share one code the way a
      # real investor data room typically works, rather than each
      # needing an account approved by the company's org admin.
      - key: DATA_ROOM_PASSWORD
        sync: false
      # PACS query/retrieve (integrations/dicom.py's pacs_find()/pacs_move(),
      # real DICOM C-FIND/C-MOVE via pynetdicom — see
      # integrations/pacs_local_test.py for how it's tested without a real
      # PACS). Left unset by default: /api/dicom/pacs/find and
      # /api/dicom/pacs/move return 503 until a hospital's actual PACS
      # connection details are entered here — this project has no PACS to
      # point at yet, so there is nothing real to default these to.
      - key: PACS_HOST
        sync: false
      - key: PACS_PORT
        value: "104"
      - key: PACS_AE_TITLE
        sync: false
      - key: PACS_CALLING_AE_TITLE
        value: CARDIOAI_PRO
      # Error monitoring/alerting (main.py's sentry_sdk.init() block,
      # closes the "no monitoring/alerting tooling" gap). Left unset by
      # default — there is no Sentry project to point at yet, and the
      # app boots and runs identically either way (main.py's init is
      # wrapped and skipped entirely when this is empty). Create a free
      # Sentry project, put its DSN here, and error tracking/alerting is
      # live on the next deploy with no code change.
      - key: SENTRY_DSN
        sync: false

  # --- scale-out path (uncomment when moving beyond a single-process demo) ---
  # - type: worker
  #   name: cardioai-pro-ingestion-worker
  #   env: docker
  #   dockerfilePath: ./backend/Dockerfile
  #   dockerContext: ./backend
  #   dockerCommand: python -m ingestion.worker
  #   plan: standard

  # Audit log retention (auth/audit.py, scripts/purge_audit_log.py): deletes
  # audit_log rows older than AUDIT_LOG_RETENTION_DAYS (default 400). Runs
  # daily at 03:00 UTC, off-peak. Shares DATABASE_URL with the web service
  # below (same `fromDatabase` wiring) — no separate credentials to manage.
  - type: cron
    name: cardioai-pro-audit-purge
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m scripts.purge_audit_log
    schedule: "0 3 * * *"
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cardioai-pro-db
          property: connectionString

databases:
  - name: cardioai-pro-db
    plan: standard
    region: ohio
    postgresMajorVersion: 16
